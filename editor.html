<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ノベルゲームメーカー</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #fff; --line: #dde0e6; --text: #222; --muted: #6b7280;
    --accent: #4f6bed; --accent-weak: #e8ecff; --danger: #d64545; --ok: #2e9d5b; --warn: #c98a00;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; background: var(--bg); color: var(--text); font-size: 14px; display: flex; flex-direction: column; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 6px 12px; color: var(--text); }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { filter: brightness(1.08); }
  button.danger { color: var(--danger); }
  button.small { padding: 3px 8px; font-size: 12px; }
  button.icon { padding: 3px 7px; min-width: 28px; }
  input[type=text], input[type=number], textarea, select { font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: #fff; color: var(--text); width: 100%; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent-weak); border-color: var(--accent); }
  textarea { resize: vertical; min-height: 64px; line-height: 1.6; }

  header { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: #fff; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header .logo { font-weight: 700; font-size: 16px; margin-right: 8px; white-space: nowrap; }
  header .title-input { max-width: 280px; }
  header .spacer { flex: 1; }
  header .status { color: var(--muted); font-size: 12px; }

  .layout { flex: 1; display: flex; min-height: 0; }
  aside { width: 290px; background: #fff; border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  aside .aside-head { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-bottom: 1px solid var(--line); }
  aside .aside-head h2 { font-size: 14px; margin: 0; }
  .scene-list { overflow-y: auto; flex: 1; padding: 8px; }
  .scene-item { padding: 8px 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; margin-bottom: 4px; }
  .scene-item:hover { background: var(--bg); }
  .scene-item.active { background: var(--accent-weak); border-color: var(--accent); }
  .scene-item .name { font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .scene-item .flow { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.5; word-break: break-all; }
  .scene-item .flow .bad { color: var(--danger); }
  .badge { font-size: 10px; padding: 1px 6px; border-radius: 10px; background: var(--ok); color: #fff; font-weight: 600; }
  .badge.end { background: #8b5cf6; }
  .badge.warn { background: var(--warn); }
  .aside-foot { border-top: 1px solid var(--line); padding: 10px 12px; font-size: 12px; color: var(--muted); }

  main { flex: 1; overflow-y: auto; padding: 20px 28px 80px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; max-width: 860px; }
  .card h3 { margin: 0 0 12px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .card h3 .num { background: var(--accent); color: #fff; border-radius: 50%; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; }
  .hint { color: var(--muted); font-size: 12px; margin: -6px 0 12px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row > label { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .field { margin-bottom: 10px; }
  .field > label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }

  .line-card { display: grid; grid-template-columns: 34px 160px 1fr auto; gap: 8px; align-items: start; padding: 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; background: #fafbfc; }
  .line-card .idx { color: var(--muted); font-size: 12px; padding-top: 8px; text-align: center; }
  .line-card .ops { display: flex; flex-direction: column; gap: 4px; }
  .choice-card { display: grid; grid-template-columns: 1fr 230px auto; gap: 8px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; background: #fafbfc; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
  .seg button { border: none; border-radius: 0; padding: 8px 16px; border-right: 1px solid var(--line); }
  .seg button:last-child { border-right: none; }
  .seg button.on { background: var(--accent); color: #fff; }
  .empty { color: var(--muted); padding: 12px; text-align: center; border: 1px dashed var(--line); border-radius: 8px; margin-bottom: 8px; }
  .problems { max-width: 860px; margin-bottom: 16px; }
  .problem { background: #fff7e6; border: 1px solid #f3d38b; color: #7a5300; padding: 8px 12px; border-radius: 8px; margin-bottom: 6px; font-size: 13px; }

  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 10; }
  .modal { background: #fff; border-radius: 12px; padding: 16px; width: min(1000px, 94vw); max-height: 94vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .modal.narrow { width: min(560px, 94vw); }
  .modal-head { display: flex; justify-content: space-between; align-items: center; }
  .modal-head h2 { margin: 0; font-size: 16px; }
  .preview-frame { width: 100%; aspect-ratio: 16 / 9; border: none; border-radius: 8px; background: #000; }
  .hidden { display: none !important; }
  .export-opt { display: flex; gap: 14px; align-items: flex-start; text-align: left; padding: 14px 16px; border-radius: 10px; width: 100%; }
  .export-opt .ico { font-size: 28px; line-height: 1; }
  .export-opt b { display: block; font-size: 15px; margin-bottom: 4px; }
  .export-opt span.d { color: var(--muted); font-size: 12px; line-height: 1.6; }
  .icon-preview { width: 64px; height: 64px; border-radius: 12px; border: 1px solid var(--line); background: #eee center/contain no-repeat; flex: none; }
  .progress { color: var(--accent); font-weight: 600; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #222; color: #fff; padding: 10px 18px; border-radius: 8px; z-index: 20; font-size: 13px; }
  @media (max-width: 800px) {
    .layout { flex-direction: column; }
    aside { width: 100%; max-height: 240px; border-right: none; border-bottom: 1px solid var(--line); }
    main { padding: 16px; }
    .line-card { grid-template-columns: 1fr; }
    .line-card .ops { flex-direction: row; }
    .choice-card { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <span class="logo">📖 ノベルゲームメーカー</span>
  <input type="text" id="project-title" class="title-input" placeholder="ゲームのタイトル">
  <button id="btn-settings" title="文字の速さ・色などの設定">⚙ 設定</button>
  <span class="spacer"></span>
  <span class="status" id="save-status"></span>
  <button id="btn-new">新規作成</button>
  <button id="btn-open">開く</button>
  <button id="btn-save">プロジェクト保存</button>
  <button id="btn-play">▶ テストプレイ</button>
  <button id="btn-export" class="primary">⬇ ゲームを出力</button>
  <input type="file" id="file-input" accept=".json,application/json" class="hidden">
</header>

<div class="layout">
  <aside>
    <div class="aside-head">
      <h2>シーン一覧</h2>
      <button class="small primary" id="btn-add-scene">＋ シーン追加</button>
    </div>
    <div class="scene-list" id="scene-list"></div>
    <div class="aside-foot">
      <span class="badge">START</span> = ゲーム開始シーン　<span class="badge end">END</span> = エンディング<br>
      編集内容はブラウザに自動保存されます。
    </div>
  </aside>
  <main id="main"></main>
</div>

<!-- テストプレイ -->
<div class="modal-bg hidden" id="preview-modal">
  <div class="modal">
    <div class="modal-head">
      <h2 id="preview-title">テストプレイ</h2>
      <div class="row">
        <button id="btn-preview-restart">最初から</button>
        <button id="btn-preview-close">閉じる</button>
      </div>
    </div>
    <iframe class="preview-frame" id="preview-frame" sandbox="allow-scripts"></iframe>
    <div class="hint" style="margin:0">クリック / Enter / スペースで文章を進めます。</div>
  </div>
</div>

<!-- 設定 -->
<div class="modal-bg hidden" id="settings-modal">
  <div class="modal narrow">
    <div class="modal-head"><h2>ゲームの設定</h2><button id="btn-settings-close">閉じる</button></div>
    <div class="field"><label>作者名（タイトル画面に表示）</label><input type="text" id="set-author"></div>
    <div class="field"><label>文字の表示速度（1文字あたりのミリ秒・0で一瞬で表示）</label><input type="number" id="set-speed" min="0" max="200"></div>
    <div class="field"><label>標準の背景色</label><input type="color" id="set-bg"></div>
    <div class="field"><label>文字色</label><input type="color" id="set-fg"></div>
    <div class="field"><label>アクセント色（選択肢・名前欄など）</label><input type="color" id="set-accent"></div>
    <h3 style="margin:6px 0 0;font-size:14px">EXE出力（Windows用）の設定</h3>
    <div class="field"><label>アイコン（PNG / JPEG。正方形の画像がおすすめ）</label>
      <div class="row"><div class="icon-preview" id="set-icon-preview"></div>
        <button id="btn-icon-pick">画像を選ぶ…</button><button id="btn-icon-reset" class="small">標準に戻す</button>
        <input type="file" id="icon-input" accept="image/png,image/jpeg,image/webp" class="hidden"></div></div>
    <div class="field"><label>ウィンドウの初期サイズ</label>
      <select id="set-size"><option value="1280x720">1280 × 720（標準・16:9）</option><option value="960x540">960 × 540（小さめ・16:9）</option><option value="1600x900">1600 × 900（大きめ・16:9）</option><option value="1024x768">1024 × 768（4:3）</option></select></div>
    <div class="field"><label>バージョン（はじめにお読みください.txt に記載）</label><input type="text" id="set-version" placeholder="1.0"></div>
    <div class="field"><label>お問い合わせ先（はじめにお読みください.txt に記載。メールアドレス・SNSなど）</label><input type="text" id="set-contact" placeholder="例：https://x.com/your_account"></div>
  </div>
</div>

<!-- 出力 -->
<div class="modal-bg hidden" id="export-modal">
  <div class="modal narrow">
    <div class="modal-head"><h2>ゲームを出力</h2><button id="btn-export-close">閉じる</button></div>
    <div id="export-problems"></div>
    <button class="export-opt" id="btn-export-exe"><span class="ico">🪟</span><span>
      <b>Windows用 EXE（販売・配布向け）</b>
      <span class="d">ゲーム名.exe・はじめにお読みください.txt・ライセンス表記をまとめたZIPファイルを作ります。
      DLsite などの販売サイトに登録しやすい形にまとめます。対応OS：Windows 10 / 11（64bit）</span></span></button>
    <button class="export-opt" id="btn-export-html"><span class="ico">🌐</span><span>
      <b>HTMLファイル</b>
      <span class="d">1つのHTMLファイルに出力します。ブラウザで開いて遊べます（Mac・スマホでも可）。体験版の配布やWeb公開向け。</span></span></button>
    <div class="hint" id="export-status" style="margin:0"></div>
  </div>
</div>

<!-- 一括入力 -->
<div class="modal-bg hidden" id="bulk-modal">
  <div class="modal narrow">
    <div class="modal-head"><h2>テキストをまとめて追加</h2><button id="btn-bulk-close">閉じる</button></div>
    <div class="hint" style="margin:0">
      1行が1メッセージになります。<br>
      「名前：セリフ」または「名前「セリフ」」と書くと、名前欄つきのメッセージになります。<br>
      メッセージ内で改行したいときは <code>\n</code> と書いてください。
    </div>
    <textarea id="bulk-text" rows="12" placeholder="朝、目が覚めると見知らぬ部屋にいた。&#10;ユウキ：ここは……どこだ？&#10;アオイ「やっと起きたのね」"></textarea>
    <div class="row" style="justify-content:flex-end"><button class="primary" id="btn-bulk-add">追加する</button></div>
  </div>
</div>

<!-- ================================================================
     ここから下は「出力されるゲーム」の中身（テンプレート）です。
     テストプレイと出力の両方で同じものを使います。
     ================================================================ -->
<script type="text/plain" id="tpl-css">
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","MS PMincho",serif;color:var(--fg);user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;background:var(--bg);transition:background .6s}
.screen{position:absolute;inset:0}
.hidden{display:none!important}
#title-screen,#end-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px}
#title-screen h1{font-size:clamp(28px,6vw,64px);margin:0 0 4px;letter-spacing:.08em;text-shadow:0 2px 12px rgba(0,0,0,.4)}
#t-author{opacity:.75;margin-bottom:20px}
#end-screen h2{font-size:clamp(28px,5vw,56px);margin:0;letter-spacing:.2em}
#end-screen .end-name{font-size:clamp(16px,2.6vw,26px);opacity:.85}
.menu-btn{font:inherit;font-size:18px;min-width:220px;padding:11px 24px;color:var(--fg);background:rgba(0,0,0,.35);border:1px solid var(--accent);border-radius:6px;cursor:pointer;transition:.15s}
.menu-btn:hover,.menu-btn:focus-visible{background:var(--accent);color:#fff;outline:none}
.menu-btn:disabled{opacity:.35;cursor:default;background:rgba(0,0,0,.35);color:var(--fg)}
#topbar{position:absolute;top:10px;right:12px;display:flex;gap:8px;z-index:3}
#topbar button,#title-tools button{font:inherit;font-size:13px;padding:5px 12px;color:var(--fg);background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.25);border-radius:4px;cursor:pointer}
#topbar button:hover,#title-tools button:hover{border-color:var(--accent)}
#title-tools{position:absolute;top:10px;right:12px;display:flex;gap:8px}
#scene-name{position:absolute;top:12px;left:16px;font-size:13px;opacity:.6}
#msgbox{position:absolute;left:3%;right:3%;bottom:4%;min-height:26%;background:rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:clamp(14px,2.5vw,26px) clamp(18px,3vw,34px);cursor:pointer}
#speaker{position:absolute;top:-18px;left:22px;background:var(--accent);color:#fff;padding:4px 18px;border-radius:4px;font-size:clamp(14px,1.8vw,18px);font-weight:bold}
#text{font-size:clamp(16px,2.3vw,24px);line-height:1.8;white-space:pre-wrap;word-break:break-word}
#next-ind{position:absolute;right:20px;bottom:12px;animation:blink 1s infinite;font-size:14px}
@keyframes blink{50%{opacity:0}}
#choices{position:absolute;left:0;right:0;top:8%;bottom:34%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:2;padding:0 10%}
#choices button{font:inherit;font-size:clamp(15px,2vw,20px);width:min(640px,100%);padding:14px 20px;color:var(--fg);background:rgba(0,0,0,.7);border:1px solid var(--accent);border-radius:8px;cursor:pointer;transition:.15s}
#choices button:hover,#choices button:focus{background:var(--accent);color:#fff;outline:none}
#slots-screen{background:rgba(0,0,0,.94);z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4% 6%;gap:16px}
#slots-screen h2{margin:0;font-size:clamp(20px,3vw,30px);letter-spacing:.15em}
#slot-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:min(900px,100%)}
.slot{font:inherit;text-align:left;color:var(--fg);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:12px 16px;cursor:pointer;min-height:84px;transition:.15s}
.slot:hover:not(:disabled),.slot:focus-visible{border-color:var(--accent);background:rgba(255,255,255,.12);outline:none}
.slot:disabled{opacity:.4;cursor:default}
.slot .no{font-weight:bold;color:var(--accent);margin-right:8px}
.slot .date{font-size:12px;opacity:.7}
.slot .snip{font-size:14px;opacity:.9;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{position:absolute;top:50px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:8px 18px;border-radius:6px;font-size:14px;z-index:9}
@media (max-width:640px){#slot-list{grid-template-columns:1fr}}
</script>

<script type="text/plain" id="tpl-body">
<div id="game">
  <div id="title-screen" class="screen">
    <div id="title-tools"><button id="btn-fs-title">全画面</button></div>
    <h1 id="t-title"></h1>
    <div id="t-author"></div>
    <button class="menu-btn" id="btn-start">はじめから</button>
    <button class="menu-btn" id="btn-continue">つづきから</button>
    <button class="menu-btn hidden" id="btn-quit">ゲーム終了</button>
  </div>
  <div id="play-screen" class="screen hidden">
    <div id="scene-name"></div>
    <div id="topbar">
      <button id="btn-save">セーブ</button>
      <button id="btn-load">ロード</button>
      <button id="btn-fs">全画面</button>
      <button id="btn-totitle">タイトル</button>
    </div>
    <div id="choices" class="hidden"></div>
    <div id="msgbox">
      <div id="speaker" class="hidden"></div>
      <div id="text"></div>
      <div id="next-ind" class="hidden">▼</div>
    </div>
  </div>
  <div id="end-screen" class="screen hidden">
    <h2>END</h2>
    <div class="end-name" id="end-name"></div>
    <button class="menu-btn" id="btn-end-title" style="margin-top:20px">タイトルへ戻る</button>
  </div>
  <div id="slots-screen" class="screen hidden">
    <h2 id="slots-title">セーブ</h2>
    <div id="slot-list"></div>
    <button class="menu-btn" id="btn-slots-back">戻る</button>
  </div>
  <div id="toast" class="hidden"></div>
</div>
</script>

<script type="text/plain" id="tpl-js">
(function () {
  "use strict";
  var G = GAME, O = OPTS || {};
  var S = G.settings || {};
  var NATIVE = !!window.__NOVEL_EXE__ && typeof window.novelSave === "function";
  var SLOTS = 6;
  var byId = {};
  G.scenes.forEach(function (s) { byId[s.id] = s; });
  var PREFIX = "novel-save:" + (G.id || G.title || "game") + ":";
  var st = { scene: null, line: 0 };
  var typing = false, timer = null, chars = [], shown = 0, inChoice = false;
  var slotsReturn = null;

  function $(id) { return document.getElementById(id); }
  function show(id) {
    ["title-screen", "play-screen", "end-screen"].forEach(function (n) { $(n).classList.toggle("hidden", n !== id); });
  }
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.remove("hidden");
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.add("hidden"); }, 1600);
  }

  // ---- 保存先：EXE ではアプリのフォルダ、ブラウザでは localStorage ----
  function storeGet(key) {
    if (NATIVE) return window.novelLoad(key).then(function (v) { return v || null; });
    try { return Promise.resolve(window.localStorage.getItem(PREFIX + key)); }
    catch (e) { return Promise.resolve(null); }
  }
  function storeSet(key, val) {
    if (NATIVE) return window.novelSave(key, val);
    try { window.localStorage.setItem(PREFIX + key, val); return Promise.resolve(); }
    catch (e) { return Promise.reject(e); }
  }
  function readSlot(i) {
    return storeGet("slot" + i).then(function (v) { try { return v ? JSON.parse(v) : null; } catch (e) { return null; } });
  }
  function readAllSlots() {
    var ps = [];
    for (var i = 1; i <= SLOTS; i++) ps.push(readSlot(i));
    return Promise.all(ps);
  }

  var root = document.documentElement.style;
  root.setProperty("--bg", S.bg || "#1b1d2a");
  root.setProperty("--fg", S.fg || "#f5f5f5");
  root.setProperty("--accent", S.accent || "#c8546a");
  document.title = G.title || "ノベルゲーム";
  if (NATIVE) $("btn-quit").classList.remove("hidden");

  function setBg(scene) { $("game").style.background = (scene && scene.bg) ? scene.bg : ""; }

  function toTitle() {
    clearInterval(timer); setBg(null);
    $("t-title").textContent = G.title || "無題のゲーム";
    $("t-author").textContent = S.author ? "作：" + S.author : "";
    $("btn-continue").disabled = true;
    readAllSlots().then(function (all) { $("btn-continue").disabled = !all.some(Boolean); });
    show("title-screen");
    setTimeout(function () { $("btn-start").focus(); }, 0);
  }

  function startScene(id, line, hops) {
    hops = hops || 0;
    var s = byId[id];
    if (!s || hops > 200) { ending(""); return; }
    st.scene = id; st.line = line || 0;
    inChoice = false;
    $("choices").classList.add("hidden"); $("choices").innerHTML = "";
    $("scene-name").textContent = O.debug ? "[" + (s.name || "") + "]" : "";
    setBg(s);
    show("play-screen");
    if (!s.lines.length) { $("speaker").classList.add("hidden"); $("text").textContent = ""; sceneEnd(s, hops); return; }
    showLine();
  }

  function showLine() {
    var s = byId[st.scene];
    if (st.line >= s.lines.length) { sceneEnd(s, 0); return; }
    var l = s.lines[st.line];
    var sp = $("speaker");
    sp.textContent = l.speaker || "";
    sp.classList.toggle("hidden", !l.speaker);
    typeText(l.text || "");
  }

  function typeText(t) {
    clearInterval(timer);
    chars = Array.from(t); shown = 0;
    $("text").textContent = "";
    $("next-ind").classList.add("hidden");
    var speed = (S.speed === 0 || S.speed) ? Number(S.speed) : 35;
    if (speed <= 0 || !chars.length) { finishTyping(); return; }
    typing = true;
    timer = setInterval(function () {
      shown++;
      $("text").textContent = chars.slice(0, shown).join("");
      if (shown >= chars.length) finishTyping();
    }, speed);
  }
  function finishTyping() {
    clearInterval(timer); typing = false;
    $("text").textContent = chars.join("");
    $("next-ind").classList.remove("hidden");
  }

  function advance() {
    if (inChoice || slotsReturn || $("play-screen").classList.contains("hidden")) return;
    if (typing) { finishTyping(); return; }
    st.line++;
    showLine();
  }

  function sceneEnd(s, hops) {
    var valid = (s.choices || []).filter(function (c) { return c.text; });
    if (s.end === "choice" && valid.length) { showChoices(valid); return; }
    if (s.end === "next" && s.next && byId[s.next]) { startScene(s.next, 0, (hops || 0) + 1); return; }
    ending(s.endTitle || "");
  }

  function showChoices(list) {
    inChoice = true;
    $("next-ind").classList.add("hidden");
    var box = $("choices"); box.innerHTML = "";
    list.forEach(function (c) {
      var b = document.createElement("button");
      b.textContent = c.text;
      b.addEventListener("click", function (e) { e.stopPropagation(); startScene(c.target, 0); });
      box.appendChild(b);
    });
    box.classList.remove("hidden");
  }

  function ending(name) {
    clearInterval(timer); inChoice = false;
    $("end-name").textContent = name || "";
    show("end-screen");
  }

  // ---- セーブ／ロード画面 ----
  function fmtDate(t) {
    var d = new Date(t), p = function (n) { return (n < 10 ? "0" : "") + n; };
    return d.getFullYear() + "/" + p(d.getMonth() + 1) + "/" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function openSlots(mode) {
    slotsReturn = mode;
    $("slots-title").textContent = mode === "save" ? "セーブ" : "ロード";
    readAllSlots().then(function (all) {
      var list = $("slot-list"); list.innerHTML = "";
      all.forEach(function (d, i) {
        var b = document.createElement("button");
        b.className = "slot";
        var head = document.createElement("div");
        var no = document.createElement("span"); no.className = "no"; no.textContent = "No." + (i + 1);
        var date = document.createElement("span"); date.className = "date"; date.textContent = d ? fmtDate(d.time) : "― データなし ―";
        head.appendChild(no); head.appendChild(date);
        var snip = document.createElement("div"); snip.className = "snip"; snip.textContent = d ? (d.snippet || "") : "";
        b.appendChild(head); b.appendChild(snip);
        if (mode === "load" && (!d || !byId[d.scene])) b.disabled = true;
        b.addEventListener("click", function () { slotClicked(mode, i + 1, d); });
        list.appendChild(b);
      });
      $("slots-screen").classList.remove("hidden");
      var first = list.querySelector(".slot:not(:disabled)"); if (first) first.focus();
    });
  }
  function closeSlots() { slotsReturn = null; $("slots-screen").classList.add("hidden"); }
  function slotClicked(mode, n, d) {
    if (mode === "save") {
      if (d && !confirm("No." + n + " に上書きしますか？")) return;
      var s = byId[st.scene], l = s && s.lines[Math.min(st.line, s.lines.length - 1)];
      var data = { scene: st.scene, line: st.line, time: Date.now(),
        snippet: l ? (l.speaker ? l.speaker + "「" + l.text + "」" : l.text).replace(/\s+/g, " ").slice(0, 60) : "" };
      storeSet("slot" + n, JSON.stringify(data))
        .then(function () { closeSlots(); toast("No." + n + " にセーブしました"); })
        .catch(function () { toast("セーブできませんでした"); });
    } else {
      closeSlots();
      var s2 = byId[d.scene];
      startScene(d.scene, Math.min(d.line, Math.max(0, s2.lines.length - 1)));
      toast("No." + n + " をロードしました");
    }
  }

  // ---- 全画面 ----
  function toggleFullscreen() {
    if (NATIVE) { window.novelFullscreen(); return; }
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    } catch (e) {}
  }

  function stop(fn) { return function (e) { e.stopPropagation(); fn(); }; }
  $("btn-start").addEventListener("click", function () { startScene(G.start, 0); });
  $("btn-continue").addEventListener("click", function () { openSlots("load"); });
  $("btn-quit").addEventListener("click", function () { if (confirm("ゲームを終了しますか？")) window.novelQuit(); });
  $("btn-end-title").addEventListener("click", toTitle);
  $("btn-totitle").addEventListener("click", stop(function () { if (confirm("タイトルに戻りますか？")) toTitle(); }));
  $("btn-save").addEventListener("click", stop(function () { openSlots("save"); }));
  $("btn-load").addEventListener("click", stop(function () { openSlots("load"); }));
  $("btn-fs").addEventListener("click", stop(toggleFullscreen));
  $("btn-fs-title").addEventListener("click", toggleFullscreen);
  $("btn-slots-back").addEventListener("click", closeSlots);
  $("play-screen").addEventListener("click", function (e) {
    if (e.target.closest("#topbar") || e.target.closest("#choices")) return;
    advance();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "F11") { e.preventDefault(); toggleFullscreen(); return; }
    if (e.key === "Escape" && slotsReturn) { closeSlots(); return; }
    if (NATIVE && (e.ctrlKey || e.metaKey || e.key === "F5" || e.key === "F3" || e.key === "F7")) { e.preventDefault(); return; }
    if ((e.key === "Enter" || e.key === " ") && !slotsReturn && !$("play-screen").classList.contains("hidden") && !inChoice) {
      if (document.activeElement && document.activeElement.tagName === "BUTTON") document.activeElement.blur();
      e.preventDefault(); advance();
    }
  });
  if (NATIVE) document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  if (O.startScene) startScene(O.startScene, 0); else toTitle();
})();
</script>

<script>
"use strict";
const STORAGE_KEY = "novel-maker-project-v1";

function uid() { return "s" + Math.random().toString(36).slice(2, 9); }
function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v;
    else if (v === true) e.setAttribute(k, "");
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c != null) e.append(c);
  return e;
}
const $ = (id) => document.getElementById(id);

function sampleProject() {
  const a = uid(), b = uid(), c = uid(), d = uid();
  return {
    title: "放課後の秘密",
    settings: { author: "", speed: 35, bg: "#1b1d2a", fg: "#f5f5f5", accent: "#c8546a" },
    start: a,
    scenes: [
      { id: a, name: "プロローグ", bg: "#2a2438", lines: [
          { speaker: "", text: "放課後の教室。窓の外はオレンジ色に染まっている。" },
          { speaker: "", text: "帰り支度をしていると、机の中に一通の手紙が入っていた。" },
          { speaker: "ユウキ", text: "……「屋上で待っています」？" },
        ], end: "choice", next: "", endTitle: "",
        choices: [ { text: "屋上へ行ってみる", target: b }, { text: "気にせず帰る", target: c } ] },
      { id: b, name: "屋上", bg: "#3b2f4a", lines: [
          { speaker: "", text: "重い扉を開けると、夕陽を背にして誰かが立っていた。" },
          { speaker: "アオイ", text: "来てくれたんだ。……ずっと、伝えたいことがあったの。" },
        ], end: "next", next: d, endTitle: "", choices: [] },
      { id: c, name: "帰り道", bg: "#1e2b3a", lines: [
          { speaker: "", text: "いたずらだろう。そう思って、手紙をかばんにしまった。" },
          { speaker: "", text: "あの手紙の差出人が誰だったのか、ぼくが知ることはなかった。" },
        ], end: "end", next: "", endTitle: "ノーマルエンド「知らないまま」", choices: [] },
      { id: d, name: "告白", bg: "#4a2f3a", lines: [
          { speaker: "アオイ", text: "明日も、一緒に帰ってくれる？" },
          { speaker: "ユウキ", text: "……うん、もちろん。" },
        ], end: "end", next: "", endTitle: "ハッピーエンド「夕焼けの約束」", choices: [] },
    ],
  };
}
function emptyProject() {
  const a = uid();
  return {
    title: "新しいゲーム",
    settings: { author: "", speed: 35, bg: "#1b1d2a", fg: "#f5f5f5", accent: "#c8546a" },
    start: a,
    scenes: [{ id: a, name: "はじまり", bg: "", lines: [{ speaker: "", text: "" }], end: "end", next: "", endTitle: "", choices: [] }],
  };
}

function normalize(p) {
  if (!p || !Array.isArray(p.scenes)) throw new Error("プロジェクトファイルの形式が正しくありません");
  p.title = p.title || "無題のゲーム";
  p.id = /^[A-Za-z0-9]{6,32}$/.test(p.id || "") ? p.id : "g" + uid().slice(1) + uid().slice(1);
  p.settings = Object.assign({ author: "", speed: 35, bg: "#1b1d2a", fg: "#f5f5f5", accent: "#c8546a",
    icon: "", width: 1280, height: 720, version: "1.0", contact: "" }, p.settings || {});
  p.scenes.forEach((s) => {
    s.id = s.id || uid(); s.name = s.name || "シーン"; s.bg = s.bg || "";
    s.lines = Array.isArray(s.lines) ? s.lines : [];
    s.choices = Array.isArray(s.choices) ? s.choices : [];
    s.end = ["next", "choice", "end"].includes(s.end) ? s.end : "end";
    s.next = s.next || ""; s.endTitle = s.endTitle || "";
  });
  if (!p.scenes.length) p.scenes.push(emptyProject().scenes[0]);
  if (!p.scenes.some((s) => s.id === p.start)) p.start = p.scenes[0].id;
  return p;
}

let project;
let currentId;
try { project = normalize(JSON.parse(localStorage.getItem(STORAGE_KEY))); }
catch (e) { project = normalize(sampleProject()); }
currentId = project.start;

const sceneById = (id) => project.scenes.find((s) => s.id === id);
const current = () => sceneById(currentId) || project.scenes[0];

// ---------- 保存 ----------
let saveTimer = null;
function changed(rerenderList = true) {
  clearTimeout(saveTimer);
  $("save-status").textContent = "保存中…";
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(project)); $("save-status").textContent = "自動保存済み"; }
    catch (e) { $("save-status").textContent = "自動保存できません（プロジェクト保存を使ってください）"; }
  }, 300);
  if (rerenderList) renderSceneList();
}
function toast(msg) {
  const t = el("div", { class: "toast" }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), 2200);
}

// ---------- 検証 ----------
function sceneProblems(s) {
  const out = [];
  if (s.end === "next") {
    if (!s.next) out.push("「次のシーン」が選ばれていません");
    else if (!sceneById(s.next)) out.push("「次のシーン」が存在しません");
  }
  if (s.end === "choice") {
    if (!s.choices.length) out.push("選択肢がありません");
    s.choices.forEach((c, i) => {
      if (!c.text.trim()) out.push(`選択肢${i + 1}の文章が空です`);
      if (!sceneById(c.target)) out.push(`選択肢${i + 1}の行き先が選ばれていません`);
    });
  }
  return out;
}
function reachable() {
  const seen = new Set(); const stack = [project.start];
  while (stack.length) {
    const id = stack.pop(); const s = sceneById(id);
    if (!s || seen.has(id)) continue; seen.add(id);
    if (s.end === "next") stack.push(s.next);
    if (s.end === "choice") s.choices.forEach((c) => stack.push(c.target));
  }
  return seen;
}

// ---------- シーン一覧 ----------
function renderSceneList() {
  const list = $("scene-list"); list.innerHTML = "";
  const reach = reachable();
  project.scenes.forEach((s) => {
    const name = (id) => { const t = sceneById(id); return t ? t.name : null; };
    let flow;
    if (s.end === "next") {
      const n = name(s.next);
      flow = n ? ["→ " + n] : [el("span", { class: "bad" }, "→ （未設定）")];
    } else if (s.end === "choice") {
      flow = s.choices.length ? s.choices.map((c, i) => {
        const n = name(c.target);
        return el("div", {}, `◇ ${c.text || "（空）"} → `, n ? n : el("span", { class: "bad" }, "（未設定）"));
      }) : [el("span", { class: "bad" }, "◇ 選択肢なし")];
    } else {
      flow = ["■ エンディング" + (s.endTitle ? "：" + s.endTitle : "")];
    }
    const badges = [];
    if (s.id === project.start) badges.push(el("span", { class: "badge" }, "START"));
    if (s.end === "end") badges.push(el("span", { class: "badge end" }, "END"));
    if (sceneProblems(s).length) badges.push(el("span", { class: "badge warn", title: sceneProblems(s).join("\n") }, "!"));
    if (!reach.has(s.id)) badges.push(el("span", { class: "badge warn", title: "どこからも到達できないシーンです" }, "未到達"));
    list.append(el("div", {
        class: "scene-item" + (s.id === currentId ? " active" : ""),
        onclick: () => { currentId = s.id; renderAll(); },
      },
      el("div", { class: "name" }, s.name || "（無名）", ...badges),
      el("div", { class: "flow" }, ...flow)));
  });
}

// ---------- シーン編集 ----------
function sceneOptions(selected, includeNew = true) {
  const sel = [el("option", { value: "" }, "― シーンを選ぶ ―")];
  project.scenes.forEach((s) => sel.push(el("option", { value: s.id, selected: s.id === selected }, s.name)));
  if (includeNew) sel.push(el("option", { value: "__new__" }, "＋ 新しいシーンを作って移動先にする"));
  return sel;
}
function handleTargetChange(selectEl, setter) {
  if (selectEl.value === "__new__") {
    const s = newScene();
    setter(s.id);
    toast(`シーン「${s.name}」を作成しました`);
    renderAll();
  } else { setter(selectEl.value); changed(); }
}
function newScene() {
  const s = { id: uid(), name: "シーン" + (project.scenes.length + 1), bg: "", lines: [{ speaker: "", text: "" }], end: "end", next: "", endTitle: "", choices: [] };
  project.scenes.push(s); changed();
  return s;
}

function renderEditor() {
  const s = current(); currentId = s.id;
  const main = $("main"); main.innerHTML = "";

  const probs = sceneProblems(s);
  if (probs.length) main.append(el("div", { class: "problems" }, probs.map((p) => el("div", { class: "problem" }, "⚠ " + p))));

  // --- シーン基本情報
  main.append(el("div", { class: "card" },
    el("h3", {}, "シーンの設定"),
    el("div", { class: "row" },
      el("div", { style: "flex:1;min-width:200px" },
        el("label", { style: "font-size:12px;color:var(--muted)" }, "シーン名（作者用のメモ。ゲームには表示されません）"),
        el("input", { type: "text", value: s.name, oninput: (e) => { s.name = e.target.value; changed(); } })),
      el("div", {},
        el("label", { style: "font-size:12px;color:var(--muted);display:block" }, "背景色"),
        el("div", { class: "row" },
          el("input", { type: "color", value: s.bg || project.settings.bg, oninput: (e) => { s.bg = e.target.value; changed(false); } }),
          el("button", { class: "small", onclick: () => { s.bg = ""; changed(false); renderEditor(); } }, "標準に戻す")))),
    el("div", { class: "row", style: "margin-top:12px" },
      s.id === project.start
        ? el("span", { class: "badge" }, "このシーンからゲームが始まります")
        : el("button", { class: "small", onclick: () => { project.start = s.id; changed(); renderEditor(); } }, "★ 開始シーンにする"),
      el("button", { class: "small", onclick: () => openPreview(s.id) }, "▶ このシーンから再生"),
      el("button", { class: "small", onclick: () => duplicateScene(s) }, "複製"),
      el("span", { style: "flex:1" }),
      el("button", { class: "small danger", onclick: () => deleteScene(s) }, "シーンを削除"))));

  // --- テキスト
  const linesWrap = el("div");
  const renderLines = () => {
    linesWrap.innerHTML = "";
    if (!s.lines.length) linesWrap.append(el("div", { class: "empty" }, "メッセージがありません。下のボタンで追加してください。"));
    s.lines.forEach((l, i) => {
      const ta = el("textarea", { rows: 2, placeholder: "表示する文章を入力（改行もそのまま表示されます）", oninput: (e) => { l.text = e.target.value; changed(false); } });
      ta.value = l.text;
      linesWrap.append(el("div", { class: "line-card" },
        el("div", { class: "idx" }, String(i + 1)),
        el("input", { type: "text", value: l.speaker, placeholder: "名前（空欄=地の文）", list: "speaker-list",
          oninput: (e) => { l.speaker = e.target.value; changed(false); }, onchange: updateSpeakerList }),
        ta,
        el("div", { class: "ops" },
          el("button", { class: "icon small", title: "上へ", disabled: i === 0, onclick: () => { move(s.lines, i, -1); renderLines(); } }, "↑"),
          el("button", { class: "icon small", title: "下へ", disabled: i === s.lines.length - 1, onclick: () => { move(s.lines, i, 1); renderLines(); } }, "↓"),
          el("button", { class: "icon small", title: "この下に追加", onclick: () => { s.lines.splice(i + 1, 0, { speaker: l.speaker, text: "" }); changed(false); renderLines(); focusLine(i + 1); } }, "＋"),
          el("button", { class: "icon small danger", title: "削除", onclick: () => { s.lines.splice(i, 1); changed(false); renderLines(); } }, "✕"))));
    });
  };
  const focusLine = (i) => { const t = linesWrap.querySelectorAll("textarea")[i]; if (t) t.focus(); };
  renderLines();
  main.append(el("div", { class: "card" },
    el("h3", {}, el("span", { class: "num" }, "1"), "表示するテキスト"),
    el("p", { class: "hint" }, "上から順に1つずつ表示されます。プレイヤーがクリックすると次へ進みます。"),
    linesWrap,
    el("div", { class: "row" },
      el("button", { class: "primary", onclick: () => { const last = s.lines[s.lines.length - 1]; s.lines.push({ speaker: last ? last.speaker : "", text: "" }); changed(false); renderLines(); focusLine(s.lines.length - 1); } }, "＋ メッセージを追加"),
      el("button", { onclick: () => openBulk(s, renderLines) }, "まとめて追加…"))));

  // --- 終わり方
  const seg = (val, label) => el("button", { class: s.end === val ? "on" : "", onclick: () => {
    s.end = val;
    if (val === "choice" && !s.choices.length) s.choices.push({ text: "", target: "" }, { text: "", target: "" });
    changed(); renderEditor();
  } }, label);
  const endBody = el("div");
  if (s.end === "next") {
    endBody.append(el("div", { class: "field" },
      el("label", {}, "次に進むシーン"),
      el("select", { onchange: (e) => handleTargetChange(e.target, (v) => { s.next = v; }) }, sceneOptions(s.next))));
  } else if (s.end === "choice") {
    endBody.append(el("p", { class: "hint", style: "margin-top:0" }, "テキストを最後まで読むと選択肢が表示されます。選んだ選択肢によって移動先のシーンが変わります。"));
    if (!s.choices.length) endBody.append(el("div", { class: "empty" }, "選択肢がありません。"));
    s.choices.forEach((c, i) => {
      endBody.append(el("div", { class: "choice-card" },
        el("input", { type: "text", value: c.text, placeholder: `選択肢${i + 1}の文章（例：右の道へ進む）`, oninput: (e) => { c.text = e.target.value; changed(); } }),
        el("select", { onchange: (e) => handleTargetChange(e.target, (v) => { c.target = v; }) }, sceneOptions(c.target)),
        el("div", { class: "row", style: "gap:4px" },
          el("button", { class: "icon small", title: "上へ", disabled: i === 0, onclick: () => { move(s.choices, i, -1); changed(); renderEditor(); } }, "↑"),
          el("button", { class: "icon small", title: "移動先を編集", disabled: !sceneById(c.target), onclick: () => { currentId = c.target; renderAll(); } }, "→"),
          el("button", { class: "icon small danger", title: "削除", onclick: () => { s.choices.splice(i, 1); changed(); renderEditor(); } }, "✕"))));
    });
    endBody.append(el("button", { onclick: () => { s.choices.push({ text: "", target: "" }); changed(); renderEditor(); } }, "＋ 選択肢を追加"));
  } else {
    endBody.append(el("div", { class: "field" },
      el("label", {}, "エンディング名（任意。END画面に表示されます）"),
      el("input", { type: "text", value: s.endTitle, placeholder: "例：ハッピーエンド「夕焼けの約束」", oninput: (e) => { s.endTitle = e.target.value; changed(); } })));
  }
  main.append(el("div", { class: "card" },
    el("h3", {}, el("span", { class: "num" }, "2"), "テキストを読み終わったら"),
    el("div", { class: "seg" }, seg("next", "次のシーンへ進む"), seg("choice", "選択肢で分岐する"), seg("end", "エンディング")),
    endBody));

  updateSpeakerList();
}

function deleteScene(s) {
  if (project.scenes.length <= 1) { alert("最後のシーンは削除できません。"); return; }
  if (!confirm(`シーン「${s.name}」を削除しますか？\nこのシーンへの移動先設定は「未設定」になります。`)) return;
  project.scenes = project.scenes.filter((x) => x !== s);

  currentId = project.scenes[0].id;
  changed(); renderAll();
}
function duplicateScene(s) {

  rows.forEach((r) => {

    else if ((m = r.match(/^([^「]{1,20})「(.*)」$/))) { speaker = m[1].trim(); text = m[2]; }

// ---------- ゲームHTMLの生成 ----------
function escHtml(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function safeJson(v) { return JSON.stringify(v).replace(/</g, "\\u003c").replace(/\u2028/g, "\\u2028").replace(/\u2029/g, "\\u2029"); }
function buildGameHTML(opts) {
  const data = {
    title: project.title, id: project.id, start: project.start,
    settings: Object.assign({}, project.settings, { icon: undefined }),
    scenes: project.scenes.map((s) => ({
      id: s.id, name: s.name, bg: s.bg, end: s.end, next: s.next, endTitle: s.endTitle,
      lines: s.lines.filter((l) => l.text.trim() || l.speaker.trim()),
      choices: s.choices.filter((c) => c.text.trim() && sceneById(c.target)),
    })),
  };
  return "<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"utf-8\">\n" +
    "<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n" +
    "<title>" + escHtml(project.title) + "</title>\n" +
    "<style>" + $("tpl-css").textContent + "</style>\n</head>\n<body>\n" +
    $("tpl-body").textContent +
    "\n<script>var GAME=" + safeJson(data) + ";var OPTS=" + safeJson(opts || {}) + ";<\/script>\n" +
    "<script>" + $("tpl-js").textContent + "<\/script>\n</body>\n</html>\n";
}

// ---------- Windows用 EXE 出力 ----------
// runtime/player-stub.js に入っている novel-player.exe（ゲーム再生用ランタイム）の
// 末尾にゲームデータを付け足し、アイコン枠を差し替えて「ゲーム名.exe」を作ります。
const DEFAULT_ICON_SVG = "data:image/svg+xml," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
  '<stop offset="0" stop-color="#4f6bed"/><stop offset="1" stop-color="#8b5cf0"/></linearGradient></defs>' +
  '<rect x="8" y="8" width="240" height="240" rx="44" fill="url(#g)"/><rect x="52" y="70" width="72" height="120" rx="10" fill="#fff"/>' +
  '<rect x="132" y="70" width="72" height="120" rx="10" fill="#fff"/></svg>');

function loadImage(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error("画像の形式に対応していません"));
    img.src = src;
  });
}
function readAsDataURL(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(file); });
}
// 画像を 256x256 の PNG（余白は透明、中央寄せ）に変換
async function imageToIconDataURL(file) {
  const img = await loadImage(await readAsDataURL(file));
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const ctx = c.getContext("2d");
  const sc = Math.min(256 / img.width, 256 / img.height);
  const w = img.width * sc, h = img.height * sc;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, (256 - w) / 2, (256 - h) / 2, w, h);
  return c.toDataURL("image/png");
}

function loadPlayerRuntime() {
  if (window.NOVEL_PLAYER) return Promise.resolve(window.NOVEL_PLAYER);
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "runtime/player-stub.js";
    const fail = () => rej(new Error("ランタイム（runtime/player-stub.js）が見つかりません。\n" +
      "editor.html と同じ場所に runtime フォルダがあることを確認してください。\n" +
      "（editor.html だけを別の場所にコピーした場合は、フォルダごと移動してください）"));
    s.onload = () => (window.NOVEL_PLAYER ? res(window.NOVEL_PLAYER) : fail());
    s.onerror = fail;
    document.head.append(s);
  });
}

const textEnc = new TextEncoder();
function b64ToBytes(b64) {
  const bin = atob(b64), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
function concatBytes(parts) {
  const out = new Uint8Array(parts.reduce((n, p) => n + p.length, 0));
  let o = 0; for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(u8) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function indexOfBytes(hay, needle, from = 0) {
  const f = needle[0];
  outer: for (let i = hay.indexOf(f, from); i !== -1 && i <= hay.length - needle.length; i = hay.indexOf(f, i + 1)) {
    for (let j = 1; j < needle.length; j++) if (hay[i + j] !== needle[j]) continue outer;
    return i;
  }
  return -1;
}
function pngChunk(type, data) {
  const out = new Uint8Array(12 + data.length), dv = new DataView(out.buffer);
  dv.setUint32(0, data.length);
  out.set(textEnc.encode(type), 4); out.set(data, 8);
  dv.setUint32(8 + data.length, crc32(out.subarray(4, 8 + data.length)));
  return out;
}
const PNG_SIG = new Uint8Array([0x89, 0x50, 0x4E, 0x47, 0x0D, 0x0A, 0x1A, 0x0A]);

// EXE 内のアイコン枠（固定サイズの PNG）を新しい PNG に置き換える
function patchIcon(exe, png, rt) {
  const marker = textEnc.encode(rt.iconSlotMarker);
  const m = indexOfBytes(exe, marker);
  if (m < 0) throw new Error("ランタイム内にアイコン枠が見つかりません");
  let start = -1;
  for (let i = m; i >= 0 && m - i < rt.iconSlotSize; i--) {
    if (exe[i] === 0x89 && indexOfBytes(exe.subarray(i, i + 8), PNG_SIG) === 0) { start = i; break; }
  }
  if (start < 0) throw new Error("アイコン枠の位置を特定できません");
  if (textEnc.encode("IEND").some((b, i) => png[png.length - 8 + i] !== b)) throw new Error("PNG の形式が正しくありません");
  const body = png.subarray(0, png.length - 12);
  const padLen = rt.iconSlotSize - body.length - 24;
  if (padLen < marker.length) throw new Error("アイコン画像のデータが大きすぎます。もっと単純な画像を使ってください");
  const pad = new Uint8Array(padLen); pad.set(marker);
  const slot = concatBytes([body, pngChunk("npAd", pad), pngChunk("IEND", new Uint8Array(0))]);
  exe.set(slot, start);
}

function dosDateTime(d) {
  return {
    time: (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1),
    date: ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate(),
  };
}
// 無圧縮 ZIP（ファイル名は UTF-8）
function makeZip(files) {
  const { time, date } = dosDateTime(new Date());
  const locals = [], centrals = [];
  let offset = 0;
  for (const f of files) {
    const name = textEnc.encode(f.name), crc = crc32(f.data);
    const lh = new Uint8Array(30 + name.length), l = new DataView(lh.buffer);
    l.setUint32(0, 0x04034b50, true); l.setUint16(4, 20, true); l.setUint16(6, 0x0800, true); l.setUint16(8, 0, true);
    l.setUint16(10, time, true); l.setUint16(12, date, true); l.setUint32(14, crc, true);
    l.setUint32(18, f.data.length, true); l.setUint32(22, f.data.length, true); l.setUint16(26, name.length, true);
    lh.set(name, 30);
    const ch = new Uint8Array(46 + name.length), c = new DataView(ch.buffer);
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
    c.setUint16(12, time, true); c.setUint16(14, date, true); c.setUint32(16, crc, true);
    c.setUint32(20, f.data.length, true); c.setUint32(24, f.data.length, true); c.setUint16(28, name.length, true);
    c.setUint32(42, offset, true); ch.set(name, 46);
    locals.push(lh, f.data); centrals.push(ch);
    offset += lh.length + f.data.length;
  }
  const cd = concatBytes(centrals);
  const end = new Uint8Array(22), e = new DataView(end.buffer);
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
  e.setUint32(12, cd.length, true); e.setUint32(16, offset, true);
  return concatBytes([...locals, cd, end]);
}

// player/storage.go の folderName と同じ規則
function saveFolderName() {
  let name = project.title.replace(/[\\/:*?"<>|\x00-\x1f]/g, "_").trim().replace(/[. ]+$/, "");
  name = Array.from(name).slice(0, 40).join("") || "game";
  const id = project.id.replace(/[^A-Za-z0-9_-]/g, "");
  return id ? name + "_" + id : name;
}
function windowsText(s) { return concatBytes([new Uint8Array([0xEF, 0xBB, 0xBF]), textEnc.encode(s.replace(/\r?\n/g, "\r\n"))]); }

function readmeText(exeName) {
  const S = project.settings;
  return [
    `『${project.title}』` + (S.version ? ` Ver.${S.version}` : ""),

    "",

    "",
  ].filter((l, i) => l !== "" || i !== 1).join("\n");
}

async function buildExeZip() {
  const rt = await loadPlayerRuntime();
  const exe = b64ToBytes(rt.exe);
  if (project.settings.icon) {
    const png = new Uint8Array(await (await fetch(project.settings.icon)).arrayBuffer());
    patchIcon(exe, png, rt);
  }
  const payload = textEnc.encode(JSON.stringify({
    title: project.title, id: project.id,
    width: project.settings.width, height: project.settings.height,
    html: buildGameHTML({}),
  }));
  const trailer = new Uint8Array(16), dv = new DataView(trailer.buffer);
  dv.setUint32(0, payload.length, true); dv.setUint32(4, Math.floor(payload.length / 2 ** 32), true);
  trailer.set(textEnc.encode("NVLPKG01"), 8);
  const game = concatBytes([exe, payload, trailer]);

  const base = fileSafe(project.title);
  const exeName = base + ".exe";
  return makeZip([
    { name: `${base}/${exeName}`, data: game },
    { name: `${base}/はじめにお読みください.txt`, data: windowsText(readmeText(exeName)) },
    { name: `${base}/THIRD_PARTY_LICENSES.txt`, data: windowsText(rt.licenses) },
  ]);
}

// ---------- ファイル ----------
function download(name, text, type) {
  const blob = new Blob([text], { type });
  const a = el("a", { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
// 保存ダイアログで保存（Chrome / Edge）。使えない場合は通常のダウンロード。
// data には中身、または中身を作る async 関数を渡す（ダイアログを先に開くため）。
// キャンセルされたら false を返す。
async function saveFile(name, data, type, description, ext) {
  const make = async () => (typeof data === "function" ? await data() : data);
  if (window.showSaveFilePicker) {
    let handle = null;
    try {
      handle = await window.showSaveFilePicker({ suggestedName: name, types: [{ description, accept: { [type]: [ext] } }] });
    } catch (e) {
      if (e.name === "AbortError") return false;
    }
    if (handle) {
      const content = await make();
      const w = await handle.createWritable();
      await w.write(new Blob([content], { type }));
      await w.close();
      return true;
    }
  }
  download(name, await make(), type);
  return true;
}
function fileSafe(s) { return (s || "game").replace(/[\\/:*?"<>|\x00-\x1f]/g, "_").trim().replace(/[. ]+$/, "") || "game"; }
